name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' ya no existe en los repos del SDK moderno y rompe el action con exit 1.
          packages: 'platform-tools'
          api-level: 34

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses || true

      - name: Configurar Gradle y compilar APK Debug
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
